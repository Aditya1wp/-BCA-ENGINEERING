<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Resource - BCA Engineering</title>
    <link rel="icon" type="image/png" href="logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .card-animate { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
        .float-icon { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-center items-center relative overflow-hidden">

    <nav class="absolute top-0 w-full z-50 glass-card border-b border-white/5 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <button onclick="history.back()" class="p-2 bg-white/5 hover:bg-white/10 rounded-lg transition-colors group">
                <svg class="w-5 h-5 text-slate-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
                <img src="logo.png" alt="Logo" class="h-10 w-auto">
                <span class="font-extrabold text-xl tracking-tighter">BCA <span class="text-cyan-400">ENGINEERING</span></span>

        </div>
        <div class="text-lg font-bold uppercase tracking-wide text-white" id="nav-title">
            Resource Type
        </div>
        <div class="w-24"></div>
    </nav>

    <!-- Background glows -->
    <div class="absolute inset-0 -z-10 pointer-events-none">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-500/8 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-500/8 blur-[120px] rounded-full"></div>
    </div>

    <div class="text-center mb-12 mt-24 px-4">
        <h1 id="page-title" class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-cyan-300 mb-4 tracking-tight">What are you looking for?</h1>
        <p id="page-desc" class="text-slate-400 max-w-xl mx-auto text-lg">Choose the type of resource you want to browse</p>
    </div>

    <div class="glass-card rounded-3xl p-10 md:p-16 text-center border border-indigo-500/20 relative w-full max-w-5xl mx-4">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-500/10 via-transparent to-transparent rounded-3xl"></div>
        <div class="relative z-10 flex flex-col md:flex-row justify-center items-center gap-8 md:gap-16">
            
            <!-- PYQ Card -->
            <button id="pyq-card" class="card-animate group relative w-full md:w-80 rounded-3xl p-[1px] bg-gradient-to-br from-cyan-500/30 to-blue-500/30 hover:from-cyan-400 hover:to-blue-500 transition-all duration-500 shadow-2xl shadow-cyan-500/5 hover:shadow-cyan-500/25 hover:-translate-y-3" style="animation-delay: 0.1s;">
                <div class="w-full bg-slate-900/90 rounded-3xl flex flex-col items-center justify-center gap-5 backdrop-blur-xl group-hover:bg-slate-900/60 transition-all duration-500 relative overflow-hidden py-12 px-8">
                    <!-- Shimmer overlay -->
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-cyan-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500" style="background-size: 200% 100%; animation: shimmer 3s ease-in-out infinite;"></div>
                    
                    <div class="float-icon p-5 bg-cyan-500/10 rounded-2xl text-cyan-400 group-hover:scale-110 group-hover:bg-cyan-500/20 transition-all duration-300 shadow-[0_0_25px_rgba(6,182,212,0.1)] group-hover:shadow-[0_0_35px_rgba(6,182,212,0.3)]">
                        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <div class="flex flex-col gap-2 items-center">
                        <span class="font-black text-3xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-300 tracking-tight z-10">PYQ</span>
                        <span class="text-sm text-slate-400 font-medium z-10 text-center leading-relaxed max-w-[220px]">Previous Year Question Papers with verified solutions</span>
                        <span class="text-[10px] text-cyan-200/40 font-bold tracking-[0.25em] uppercase z-10 mt-2">EXAM PREPARATION</span>
                    </div>
                </div>
            </button>

            <!-- Divider -->
            <div class="hidden md:flex flex-col items-center gap-3">
                <div class="w-px h-16 bg-gradient-to-b from-transparent via-slate-600 to-transparent"></div>
                <span class="text-slate-500 font-black text-sm tracking-widest">OR</span>
                <div class="w-px h-16 bg-gradient-to-b from-transparent via-slate-600 to-transparent"></div>
            </div>
            <div class="md:hidden flex items-center gap-4 w-full max-w-[200px]">
                <div class="h-px flex-1 bg-gradient-to-r from-transparent via-slate-600 to-transparent"></div>
                <span class="text-slate-500 font-black text-sm tracking-widest">OR</span>
                <div class="h-px flex-1 bg-gradient-to-r from-transparent via-slate-600 to-transparent"></div>
            </div>

            <!-- Notes Card -->
            <button id="notes-card" class="card-animate group relative w-full md:w-80 rounded-3xl p-[1px] bg-gradient-to-br from-emerald-500/30 to-teal-500/30 hover:from-emerald-400 hover:to-teal-500 transition-all duration-500 shadow-2xl shadow-emerald-500/5 hover:shadow-emerald-500/25 hover:-translate-y-3" style="animation-delay: 0.3s;">
                <div class="w-full bg-slate-900/90 rounded-3xl flex flex-col items-center justify-center gap-5 backdrop-blur-xl group-hover:bg-slate-900/60 transition-all duration-500 relative overflow-hidden py-12 px-8">
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-emerald-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500" style="background-size: 200% 100%; animation: shimmer 3s ease-in-out infinite;"></div>
                    
                    <div class="float-icon p-5 bg-emerald-500/10 rounded-2xl text-emerald-400 group-hover:scale-110 group-hover:bg-emerald-500/20 transition-all duration-300 shadow-[0_0_25px_rgba(16,185,129,0.1)] group-hover:shadow-[0_0_35px_rgba(16,185,129,0.3)]" style="animation-delay: 0.5s;">
                        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    </div>
                    <div class="flex flex-col gap-2 items-center">
                        <span class="font-black text-3xl text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-teal-300 tracking-tight z-10">Notes</span>
                        <span class="text-sm text-slate-400 font-medium z-10 text-center leading-relaxed max-w-[220px]">Hand-written & typed study notes from toppers and faculty</span>
                        <span class="text-[10px] text-emerald-200/40 font-bold tracking-[0.25em] uppercase z-10 mt-2">STUDY MATERIAL</span>
                    </div>
                </div>
            </button>

        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const course = params.get('course') || 'BCA';
        const type = params.get('type') || 'self-financed';

        document.getElementById('page-title').innerText = `${course.toUpperCase()} Resources`;
        document.getElementById('page-desc').innerText = `Choose the type of resource you want to browse for ${course.toUpperCase()}`;
        document.getElementById('nav-title').innerText = `${course.toUpperCase()} — Resource Type`;

        document.getElementById('pyq-card').addEventListener('click', () => {
            window.location.href = `viewer.html?course=${encodeURIComponent(course)}&docType=pyq`;
        });

        document.getElementById('notes-card').addEventListener('click', () => {
            window.location.href = `viewer.html?course=${encodeURIComponent(course)}&docType=notes`;
        });
    </script>

    <script src="upload-system.js"></script>
</body>
</html>
