<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BCA Engineering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); }
        .nav-link { transition: all 0.3s ease; border-bottom: 2px solid transparent; }
        .nav-link:hover { color: #06b6d4; border-bottom-color: #06b6d4; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .ai-bubble { max-width: 85%; border-radius: 18px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.875rem; line-height: 1.5; }
        
        /* Dashboard Box Hover Effects */
        .dash-box { transition: all 0.3s ease; cursor: pointer; border: 2px solid rgba(255, 255, 255, 0.2); }
        .dash-box:hover { border-color: rgba(6, 182, 212, 0.8); box-shadow: 0 0 30px rgba(6, 182, 212, 0.2); transform: translateY(-4px); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative overflow-hidden">

    <nav class="absolute top-0 w-full z-50 glass-card border-b border-white/5 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">Σ</div>
            <span class="font-extrabold text-xl tracking-tighter hidden sm:block">BCA <span class="text-cyan-400">ENGINEERING</span></span>
        </div>
        <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 gap-16 text-xl font-black tracking-wide">
            <a href="categories.html" class="nav-link text-white">course</a>
            <a href="categories.html" class="nav-link text-slate-400 hover:text-white uppercase">PYQ</a>
        </div>
        <button id="ai-toggle-top" class="bg-cyan-500 hover:bg-cyan-400 text-slate-900 px-4 py-1.5 rounded-full text-xs font-bold transition-all">AI TUTOR ACTIVE</button>
    </nav>

    <!-- Background Glow -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-900/20 via-[#0f172a] to-[#0f172a] -z-10 pointer-events-none"></div>

    <main class="flex-1 flex flex-col items-center justify-center px-6 pt-24 pb-20 w-full max-w-5xl mx-auto">
        <h1 class="text-5xl md:text-6xl font-black text-white mb-16 tracking-wide">DASHBOARD</h1>

        <div class="w-full space-y-6">
            <!-- Top Row: Course and PYQ -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                <div onclick="window.location.href='categories.html'" class="dash-box glass-card rounded-2xl h-48 md:h-64 flex items-center justify-center bg-slate-800/50 group">
                    <h2 class="text-3xl md:text-4xl font-bold text-white group-hover:text-cyan-300 transition-colors tracking-widest">COURSE</h2>
                </div>
                <div onclick="window.location.href='categories.html'" class="dash-box glass-card rounded-2xl h-48 md:h-64 flex items-center justify-center bg-slate-800/50 group">
                    <h2 class="text-3xl md:text-4xl font-bold text-white group-hover:text-cyan-300 transition-colors tracking-widest">PYQ</h2>
                </div>
            </div>
            
            <!-- Bottom Row: About Section -->
            <div onclick="alert('About Section Coming Soon!')" class="dash-box glass-card rounded-2xl h-32 md:h-48 flex items-center px-12 bg-slate-800/50 group">
                <h2 class="text-2xl md:text-3xl font-bold text-white group-hover:text-cyan-300 transition-colors tracking-widest">ABOUT SECTION</h2>
            </div>
        </div>
    </main>

    
    <!-- AI Chat Container -->
    <div id="ai-chat-container" class="fixed bottom-6 left-6 z-[60]">
        <button id="ai-toggle-btn" class="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-indigo-600 rounded-full shadow-2xl flex items-center justify-center text-white hover:scale-110 transition-transform active:scale-95 group">
            <svg class="h-8 w-8 group-hover:-rotate-12 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
        </button>
        
        <div id="ai-chat-window" class="hidden absolute bottom-20 left-0 w-80 md:w-96 glass-card rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-white/10" style="background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(16px);">
            <div class="p-4 bg-slate-900/80 text-white flex justify-between items-center border-b border-white/5">
                <div class="flex items-center"><div class="w-2 h-2 bg-emerald-400 rounded-full mr-2 animate-pulse"></div><span class="font-bold text-xs uppercase tracking-widest">Master Engineer AI</span></div>
                <button id="close-chat" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            
            <div class="p-2 flex gap-1 overflow-x-auto bg-slate-800/50">
                <button onclick="askAI('Summarize BCA Syllabus')" class="text-[10px] bg-slate-700 hover:bg-rose-500/20 px-2 py-1 rounded whitespace-nowrap">BCA Syllabus</button>
                <button onclick="askAI('Explain .NET CLR Process')" class="text-[10px] bg-slate-700 hover:bg-emerald-500/20 px-2 py-1 rounded whitespace-nowrap">CLR Logic</button>
                <button onclick="askAI('What is Solid Waste Management?')" class="text-[10px] bg-slate-700 hover:bg-amber-500/20 px-2 py-1 rounded whitespace-nowrap">Waste Management</button>
            </div>

            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto max-h-96 min-h-[350px] bg-slate-900/40 space-y-4">
                <div class="ai-bubble bg-slate-800 text-slate-300 self-start border border-white/5 shadow-sm" style="max-width: 85%; border-radius: 18px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.875rem;">Hello Engineer! I am your AI assistant trained on the BCA curriculum. How can I help you today?</div>
            </div>

            <div class="p-3 border-t border-white/5 flex gap-2 bg-slate-900/80">
                <input type="text" id="chat-input" placeholder="Query the engineering brain..." class="flex-1 bg-slate-800 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-cyan-500">
                <button id="send-chat" class="bg-indigo-600 text-white p-2 rounded-lg hover:bg-indigo-500 transition-colors">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg>
                </button>
            </div>
        </div>
    </div>

    <script id="ai-script-block">
        const systemPrompt = "Act as a world-class Full Stack System Engineer and Tutor for the BCA Professional track. You are an expert in BCA courses. Provide high-level technical responses. Use code blocks for examples. Keep tone professional yet encouraging.";
        const chatWindow = document.getElementById('ai-chat-window');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');
        const sendBtn = document.getElementById('send-chat');

        if(document.getElementById('ai-toggle-btn')) { document.getElementById('ai-toggle-btn').onclick = () => chatWindow.classList.toggle('hidden'); }
        if(document.getElementById('ai-toggle-top')) { document.getElementById('ai-toggle-top').onclick = () => chatWindow.classList.toggle('hidden'); }
        if(document.getElementById('close-chat')) { document.getElementById('close-chat').onclick = () => chatWindow.classList.add('hidden'); }

        async function askAI(text) { chatInput.value = text; sendMessage(); }

        async function sendMessage() {
            const msg = chatInput.value.trim();
            if (!msg) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'ai-bubble bg-indigo-600/30 text-white self-end ml-auto border border-indigo-500/20';
            userDiv.style.cssText = 'max-width: 85%; border-radius: 18px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.875rem; align-self: flex-end; margin-left: auto;';
            userDiv.innerText = msg;
            chatMessages.appendChild(userDiv);
            chatInput.value = '';
            
            const loadDiv = document.createElement('div');
            loadDiv.className = 'ai-bubble bg-slate-800 text-slate-400 self-start italic';
            loadDiv.style.cssText = 'max-width: 85%; border-radius: 18px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.875rem;';
            loadDiv.innerHTML = 'Analyzing...';
            chatMessages.appendChild(loadDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: msg }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                });
                const data = await res.json();
                const aiMsg = data.candidates?.[0]?.content?.parts?.[0]?.text || "Connection lost to the central server.";
                
                loadDiv.remove();
                const aiDiv = document.createElement('div');
                aiDiv.className = 'ai-bubble bg-slate-800 text-slate-300 self-start border border-white/5';
                aiDiv.style.cssText = 'max-width: 85%; border-radius: 18px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.875rem;';
                aiDiv.innerHTML = '<div class="font-bold text-[10px] text-cyan-400 mb-2 tracking-tighter uppercase">AI Response</div>' + aiMsg.replace(/\n/g, '<br>').replace(/```/g, '<code class="bg-black/50 px-1 rounded">');
                chatMessages.appendChild(aiDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (err) {
                loadDiv.innerHTML = "System Error: Check API Key or Network Connection.";
            }
        }
        if(sendBtn) sendBtn.onclick = sendMessage;
        if(chatInput) chatInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
