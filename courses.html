<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Catalog - BCA Engineering</title>
    <link rel="icon" type="image/png" href="logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #06b6d4;
            --dark-bg: #0b1120;
            --card-bg: #111827;
            --text-main: #f0f4ff;
            --text-dim: #8896b3;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body { 
            font-family: 'DM Sans', sans-serif; 
            background-color: var(--dark-bg); 
            color: var(--text-main); 
            scroll-behavior: smooth; 
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 40%);
        }

        /* Technical Blueprint Grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }

        .glass-card { 
            background: rgba(17, 24, 39, 0.8); 
            backdrop-filter: blur(16px) saturate(180%); 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-blend-mode: overlay;
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); 
        }

        /* --- HAMBURGER MENU --- */
        .nav-controls { display: flex; align-items: center; gap: 15px; }
        .hamburger-btn { background: transparent; border: none; cursor: pointer; padding: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 1100; transition: 0.3s; }
        .hamburger-line { width: 24px; height: 2px; background: white; transition: 0.4s cubic-bezier(0.68, -0.6, 0.32, 1.6); border-radius: 2px; }
        .hamburger-btn.active .line-1 { transform: translateY(8px) rotate(45deg); background: var(--accent); }
        .hamburger-btn.active .line-2 { opacity: 0; transform: translateX(-20px); }
        .hamburger-btn.active .line-3 { transform: translateY(-8px) rotate(-45deg); background: var(--accent); }

        .menu-overlay {
            position: fixed; top: 15px; right: -450px; bottom: 15px; width: 420px;
            background: rgba(10, 15, 28, 0.85);
            backdrop-filter: blur(40px) saturate(200%);
            z-index: 3000; display: flex; flex-direction: column; padding: 40px;
            border-radius: 40px 0 0 40px; border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: -30px 0 80px rgba(0,0,0,0.7);
            transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; pointer-events: none;
        }
        .menu-overlay.active { right: 0; opacity: 1; pointer-events: all; }

        .menu-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 2900;
            display: none; cursor: pointer; backdrop-filter: blur(4px);
        }
        .menu-backdrop.active { display: block; }

        .menu-header { margin-top: 20px; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .menu-header .label { font-size: 10px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); animation: pulse 2s infinite; }
        
        .menu-links-container { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        .menu-link {
            font-size: 1rem; font-weight: 600; color: rgba(255,255,255,0.6); text-decoration: none;
            transition: 0.4s; font-family: 'JetBrains Mono', monospace;
            opacity: 0; transform: translateX(50px) rotateY(15deg);
            display: flex; align-items: center; gap: 18px; padding: 16px 20px; border-radius: 16px;
            position: relative; overflow: hidden;
        }
        .menu-link::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); transition: 0.5s; }
        .menu-link:hover::after { left: 100%; }
        .menu-overlay.active .menu-link { opacity: 1; transform: translateX(0) rotateY(0); }
        .menu-link:hover { color: white; background: rgba(255, 255, 255, 0.05); transform: translateX(10px); }

        .menu-footer { margin-top: auto; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .footer-label { font-size: 10px; color: rgba(255,255,255,0.3); }
        .social-icons { display: flex; gap: 15px; color: rgba(255,255,255,0.3); }
        .social-icons i { cursor: pointer; transition: 0.3s; }
        .social-icons i:hover { color: var(--accent); }

        .menu-close-btn {
            position: absolute; top: 25px; right: 25px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); color: white; width: 40px; height: 40px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; transition: 0.3s; z-index: 10;
        }
        .menu-close-btn:hover { background: var(--accent); color: black; transform: rotate(90deg); }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        /* Navigation Controls */
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #main-upload-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.8rem;
            transition: 0.3s;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
        }

        #main-upload-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
            color: black;
        }

        @media (max-width: 600px) {
            nav { padding: 10px 15px !important; }
            .logo-text { display: none; }
            .menu-overlay { width: 85%; right: -100%; top: 0; bottom: 0; border-radius: 0; }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <div class="menu-backdrop" id="menu-backdrop" onclick="toggleMenu()"></div>

    <nav class="fixed top-0 w-full z-[1100] glass-card border-b border-white/5 py-4 px-6 flex justify-between items-center" style="border-radius: 0;">
        <div class="flex items-center gap-4">
            <button id="back-btn" style="background: transparent; border: 1px solid var(--glass-border); color: #94a3b8; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s;">&larr;</button>
            <div class="flex items-center gap-4 cursor-pointer" onclick="location.href='index.html'">
                <img src="logo.png" alt="Logo" class="h-10 w-auto">
                <span class="font-bold text-xl tracking-tighter logo-text" style="font-family: 'JetBrains Mono';">BCA <span class="text-cyan-400">ENGINEER</span></span>
            </div>
        </div>
        
        <div class="nav-controls">
            <button id="main-upload-btn" onclick="openUploadModal()">
                <span class="upload-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </span>
                UPLOAD
            </button>
            <button class="hamburger-btn" id="menu-toggle">
                <div class="hamburger-line line-1"></div>
                <div class="hamburger-line line-2"></div>
                <div class="hamburger-line line-3"></div>
            </button>
        </div>
    </nav>

    <!-- Full Screen Menu Overlay -->
    <div class="menu-overlay" id="menu-overlay">
        <button class="menu-close-btn" onclick="toggleMenu()">&times;</button>
        <div class="menu-header">
            <div class="label"><div class="status-dot"></div> Scholar Console v2.0</div>
            <div style="font-size: 18px; font-weight: 800; margin-top: 10px; font-family: 'Playfair Display'; color: white;">Patna University Portal</div>
        </div>

        <div class="menu-links-container">
            <a href="index.html#dashboard" class="menu-link"><i>📊</i> Academic Dashboard</a>
            <a href="index.html#features" class="menu-link"><i>🏛️</i> University Portal</a>
            <a href="index.html#about" class="menu-link"><i>📜</i> Patna University Legacy</a>
            <a href="index.html#about" class="menu-link"><i>🤝</i> Join the Community</a>
            <a href="#" onclick="toggleMenu(); document.getElementById('ai-chat-window').classList.remove('hidden'); return false;" class="menu-link" style="margin-top: 20px; color: var(--accent); background: rgba(6,182,212,0.05); border: 1px solid rgba(6,182,212,0.1);"><i>🤖</i> University AI Guide</a>
        </div>

        <div class="menu-footer">
            <div class="footer-label">SYSTEM_READY // 2026</div>
            <div class="social-icons">
                <i onclick="window.open('https://github.com/Aditya1wp')">🔏</i>
                <i>🌐</i>
                <i>📡</i>
            </div>
        </div>
    </div>

    <main class="flex-1 max-w-7xl mx-auto w-full px-6 pt-32 pb-24 relative">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-96 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-indigo-500/10 via-transparent to-transparent -z-10 pointer-events-none"></div>
        
        <header class="text-center mb-16">
            <h1 id="page-title" class="text-5xl md:text-7xl font-bold mb-6 leading-tight text-white" style="font-family: 'Playfair Display', serif;">Loading Catalog...</h1>
            <p id="page-desc" class="text-slate-400 text-lg md:text-xl max-w-3xl mx-auto font-light leading-relaxed"></p>
        </header>

        <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Courses will be injected here by JS -->
        </div>
    </main>

    <script>
        const courseData = {
            'regular': {
                title: "Regular Courses",
                desc: "Subsidized foundational academic programs funded by the state government with a theoretical focus.",
                courses: [
                    { name: "B.A. (Hons)", desc: "Hindi, English, History, Pol. Science, etc.", duration: "3-4 Years (FYUGP)", semesters: 8, icon: "M12 14l9-5-9-5-9 5 9 5z M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z", color: "cyan" },
                    { name: "B.Sc. (Hons)", desc: "Physics, Chemistry, Botany, Zoology, Math", duration: "3-4 Years (FYUGP)", semesters: 8, icon: "M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z", color: "indigo" },
                    { name: "B.Com. (Hons)", desc: "Accounting, Economics, and Financial Theory", duration: "3-4 Years (FYUGP)", semesters: 8, icon: "M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z", color: "emerald" },
                    { name: "LL.B.", desc: "3-Year Law Program focusing on legal fundamentals.", duration: "3 Years", semesters: 6, icon: "M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3", color: "rose" },
                    { name: "Postgraduate", desc: "M.A., M.Sc., M.Com. (Traditional subjects)", duration: "2 Years", semesters: 4, icon: "M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z", color: "amber" },
                    { name: "B.F.A.", desc: "Bachelor of Fine Arts", duration: "4 Years", semesters: 8, icon: "M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z", color: "fuchsia" }
                ]
            },
            'self-financed': {
                title: "Self Financed Courses",
                desc: "Professional and vocational programs funded by tuition fees, with a heavy focus on industrial training and skill development.",
                courses: [
                    { name: "BCA", desc: "Bachelor of Computer Applications", duration: "Science College, B.N. College, Magadh Mahila", semesters: 6, icon: "M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z", color: "cyan" },
                    { name: "BBA", desc: "Bachelor of Business Administration", duration: "B.N. College, Magadh Mahila, Patna College", semesters: 6, icon: "M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z", color: "indigo" },
                    { name: "BMC", desc: "Bachelor of Mass Communication", duration: "Patna College", semesters: 6, icon: "M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z", color: "rose" },
                    { name: "B.Sc. Biotech", desc: "Advanced Life Sciences & Biotechnology", duration: "Science College, B.N. College", semesters: 6, icon: "M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z", color: "emerald" },
                    { name: "B.Com.", desc: "Commerce (Self-Finance)", duration: "Magadh Mahila College", semesters: 6, icon: "M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z", color: "amber" },
                    { name: "MBA", desc: "Master of Business Administration", duration: "Dept. of Applied Economics & Commerce", semesters: 4, icon: "M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z", color: "fuchsia" },
                    { name: "MCA", desc: "Master of Computer Applications", duration: "Dept. of Statistics / Computer Centre", semesters: 4, icon: "M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4", color: "cyan" },
                    { name: "MSW", desc: "Master of Social Work", duration: "Dept. of Sociology", semesters: 4, icon: "M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z", color: "rose" },
                    { name: "PG Diploma", desc: "Remote Sensing, Yoga, HRD, etc.", duration: "Various University Departments", semesters: 2, icon: "M9 12l2 2 4-4V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2v-3.5", color: "indigo" }
                ]
            }
        };

        const params = new URLSearchParams(window.location.search);
        const type = params.get('type');
        const data = courseData[type];

        if (!data) {
            document.getElementById('page-title').innerText = "Course Category Not Found";
            document.getElementById('page-desc').innerText = "Please return to the dashboard and select a valid course category.";
        } else {
            document.getElementById('page-title').innerText = data.title;
            document.getElementById('page-desc').innerText = data.desc;

            const grid = document.getElementById('courses-grid');
            
            data.courses.forEach((course, index) => {
                const delay = index * 100;
                const c = course.color;
                
                let targetHref = `resource-type.html?course=${encodeURIComponent(course.name)}&type=${type}`;
                
                grid.innerHTML += `
                    <div onclick="window.location.href='${targetHref}'" class="glass-card rounded-3xl p-8 relative overflow-hidden group hover:-translate-y-3 transition-all duration-500 cursor-pointer animate-[supremeEntrance_0.8s_cubic-bezier(0.16,1,0.3,1)_forwards]" style="animation-delay: ${delay}ms; opacity: 0;">
                        <!-- Animated Aura -->
                        <div class="absolute -right-20 -top-20 w-64 h-64 bg-${c}-500/5 rounded-full blur-[80px] group-hover:bg-${c}-500/15 transition-all duration-700"></div>
                        
                        <div class="flex items-start justify-between mb-8 relative z-10">
                            <div class="p-4 bg-${c}-500/10 rounded-2xl text-${c}-400 group-hover:scale-110 group-hover:rotate-[-5deg] transition-all duration-500 border border-${c}-500/20 shadow-lg shadow-${c}-500/10">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${course.icon}"></path></svg>
                            </div>
                            <div class="flex flex-col items-end gap-2">
                                <div class="bg-${c}-500/10 text-${c}-400 px-3 py-1 rounded-full text-[10px] font-bold tracking-widest uppercase border border-${c}-500/20">${course.semesters} SEMESTERS</div>
                                <div class="text-[9px] text-white/30 font-mono">STATUS: ACTIVE</div>
                            </div>
                        </div>
                        
                        <div class="relative z-10">
                            <h3 class="text-2xl font-bold text-white mb-3 group-hover:text-${c}-300 transition-colors tracking-tight">${course.name}</h3>
                            <p class="text-sm text-slate-400 mb-8 leading-relaxed font-light">${course.desc}</p>
                            
                            <div class="pt-6 border-t border-white/5 flex items-center justify-between">
                                <div class="flex flex-col">
                                    <span class="text-[9px] font-bold tracking-widest uppercase text-slate-500 mb-1">Affiliation</span>
                                    <span class="text-xs font-medium text-white/80">${course.duration}</span>
                                </div>
                                <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-${c}-500 group-hover:text-black transition-all duration-500">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
    <style>
        @keyframes supremeEntrance {
            from { opacity: 0; transform: translateY(40px) rotateY(10deg); }
            to { opacity: 1; transform: translateY(0) rotateY(0); }
        }
    </style>

    <script>
        // Hamburger Menu Toggle Logic
        const menuToggle = document.getElementById('menu-toggle');
        const menuOverlay = document.getElementById('menu-overlay');
        const menuBackdrop = document.getElementById('menu-backdrop');

        function toggleMenu() {
            menuToggle.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            menuBackdrop.classList.toggle('active');
            document.body.style.overflow = menuOverlay.classList.contains('active') ? 'hidden' : 'auto';
        }
        window.toggleMenu = toggleMenu;

        if(menuToggle) menuToggle.addEventListener('click', toggleMenu);

        // Back button logic
        const backBtn = document.getElementById('back-btn');
        if (backBtn) {
            backBtn.onclick = () => {
                window.location.href = 'categories.html';
            };
        }
    </script>

    
    <!-- AI Chatbot Integration -->
    <script src="ai-bot.js"></script>
    </script>
    <script src="upload-system.js"></script>
</body>
</html>
