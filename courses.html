<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Catalog - BCA Engineering</title>
    <link rel="icon" type="image/png" href="logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; scroll-behavior: smooth; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="fixed top-0 w-full z-50 glass-card border-b border-white/5 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='index.html'" class="p-2 bg-white/5 hover:bg-white/10 rounded-lg transition-colors group">
                <svg class="w-5 h-5 text-slate-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
                <img src="logo.png" alt="Logo" class="w-8 h-8 rounded-lg shadow-lg shadow-indigo-500/20">
                <span class="font-extrabold text-xl tracking-tighter">BCA <span class="text-cyan-400">ENGINEERING</span></span>

        </div>
        <div class="text-lg font-bold uppercase tracking-wide text-white" id="nav-title">
            Course Catalog
        </div>
        <div class="w-24"></div> <!-- Spacer for centering -->
    </nav>

    <main class="flex-1 max-w-7xl mx-auto w-full px-6 pt-32 pb-24 relative">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-96 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-indigo-500/10 via-transparent to-transparent -z-10 pointer-events-none"></div>
        
        <header class="text-center mb-16">
            <h1 id="page-title" class="text-5xl md:text-6xl font-black mb-6 leading-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-rose-400">Loading Courses...</h1>
            <p id="page-desc" class="text-slate-400 text-lg md:text-xl max-w-3xl mx-auto font-light leading-relaxed"></p>
        </header>

        <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Courses will be injected here by JS -->
        </div>
    </main>

    <script>
        const courseData = {
            'regular': {
                title: "Regular Courses",
                desc: "Subsidized foundational academic programs funded by the state government with a theoretical focus.",
                courses: [
                    { name: "B.A. (Hons)", desc: "Hindi, English, History, Pol. Science, etc.", duration: "3-4 Years (FYUGP)", semesters: 8, icon: "M12 14l9-5-9-5-9 5 9 5z M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z", color: "cyan" },
                    { name: "B.Sc. (Hons)", desc: "Physics, Chemistry, Botany, Zoology, Math", duration: "3-4 Years (FYUGP)", semesters: 8, icon: "M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z", color: "indigo" },
                    { name: "B.Com. (Hons)", desc: "Accounting, Economics, and Financial Theory", duration: "3-4 Years (FYUGP)", semesters: 8, icon: "M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z", color: "emerald" },
                    { name: "LL.B.", desc: "3-Year Law Program focusing on legal fundamentals.", duration: "3 Years", semesters: 6, icon: "M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3", color: "rose" },
                    { name: "Postgraduate", desc: "M.A., M.Sc., M.Com. (Traditional subjects)", duration: "2 Years", semesters: 4, icon: "M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z", color: "amber" },
                    { name: "B.F.A.", desc: "Bachelor of Fine Arts", duration: "4 Years", semesters: 8, icon: "M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z", color: "fuchsia" }
                ]
            },
            'self-financed': {
                title: "Self Financed Courses",
                desc: "Professional and vocational programs funded by tuition fees, with a heavy focus on industrial training and skill development.",
                courses: [
                    { name: "BCA", desc: "Bachelor of Computer Applications", duration: "Science College, B.N. College, Magadh Mahila", semesters: 6, icon: "M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z", color: "cyan" },
                    { name: "BBA", desc: "Bachelor of Business Administration", duration: "B.N. College, Magadh Mahila, Patna College", semesters: 6, icon: "M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z", color: "indigo" },
                    { name: "BMC", desc: "Bachelor of Mass Communication", duration: "Patna College", semesters: 6, icon: "M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z", color: "rose" },
                    { name: "B.Sc. Biotech", desc: "Advanced Life Sciences & Biotechnology", duration: "Science College, B.N. College", semesters: 6, icon: "M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z", color: "emerald" },
                    { name: "B.Com.", desc: "Commerce (Self-Finance)", duration: "Magadh Mahila College", semesters: 6, icon: "M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z", color: "amber" },
                    { name: "MBA", desc: "Master of Business Administration", duration: "Dept. of Applied Economics & Commerce", semesters: 4, icon: "M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z", color: "fuchsia" },
                    { name: "MCA", desc: "Master of Computer Applications", duration: "Dept. of Statistics / Computer Centre", semesters: 4, icon: "M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4", color: "cyan" },
                    { name: "MSW", desc: "Master of Social Work", duration: "Dept. of Sociology", semesters: 4, icon: "M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z", color: "rose" },
                    { name: "PG Diploma", desc: "Remote Sensing, Yoga, HRD, etc.", duration: "Various University Departments", semesters: 2, icon: "M9 12l2 2 4-4V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2v-3.5", color: "indigo" }
                ]
            }
        };

        const params = new URLSearchParams(window.location.search);
        const type = params.get('type');
        const data = courseData[type];

        if (!data) {
            document.getElementById('page-title').innerText = "Course Category Not Found";
            document.getElementById('page-desc').innerText = "Please return to the dashboard and select a valid course category.";
        } else {
            document.getElementById('page-title').innerText = data.title;
            document.getElementById('page-desc').innerText = data.desc;
            document.getElementById('nav-title').innerText = data.title;

            const grid = document.getElementById('courses-grid');
            
            data.courses.forEach((course, index) => {
                // Generate a slight delay for staggered animation
                const delay = index * 100;
                const c = course.color;
                
                let targetHref = `resource-type.html?course=${encodeURIComponent(course.name)}&type=${type}`;
                
                const clickableClass = 'cursor-pointer';
                const onClick = `onclick="window.location.href='${targetHref}'"`;

                grid.innerHTML += `
                    <div ${onClick} class="glass-card rounded-2xl p-6 relative overflow-hidden group hover:-translate-y-2 transition-all duration-300 animate-[fadeIn_0.5s_ease-out_forwards] ${clickableClass}" style="animation-delay: ${delay}ms; opacity: 0;">
                        <div class="absolute -right-10 -top-10 w-32 h-32 bg-${c}-500/10 rounded-full blur-3xl group-hover:bg-${c}-500/20 transition-all"></div>
                        
                        <div class="flex items-start justify-between mb-4 relative z-10">
                            <div class="p-3 bg-${c}-500/10 rounded-xl text-${c}-400 group-hover:scale-110 transition-transform">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${course.icon}"></path></svg>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="bg-${c}-500/10 text-${c}-400 px-2.5 py-1 rounded-lg text-[10px] font-black tracking-widest uppercase border border-${c}-500/20">${course.semesters} SEM</div>
                                <div class="bg-white/5 text-white/50 px-2 py-1 rounded text-xs group-hover:bg-white/10 group-hover:text-white transition-colors border border-white/5">Browse</div>
                            </div>
                        </div>
                        
                        <div class="relative z-10">
                            <h3 class="text-xl font-bold text-white mb-2 group-hover:text-${c}-300 transition-colors">${course.name}</h3>
                            <p class="text-sm text-slate-400 mb-4 h-10">${course.desc}</p>
                            
                            <div class="pt-4 border-t border-white/5 flex items-center justify-between">
                                <span class="text-[10px] font-bold tracking-widest uppercase text-slate-500">Duration/Location</span>
                                <span class="text-xs font-semibold text-${c}-400 bg-${c}-500/10 px-2 py-1 rounded">${course.duration}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    
    <!-- AI Chat Container -->
    <div id="ai-chat-container" class="fixed bottom-6 left-6 z-[60]">
        <button id="ai-toggle-btn" class="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-indigo-600 rounded-full shadow-2xl flex items-center justify-center text-white hover:scale-110 transition-transform active:scale-95 group border-0 outline-none cursor-pointer">
            <svg class="h-8 w-8 group-hover:-rotate-12 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
        </button>
        
        <div id="ai-chat-window" class="hidden absolute bottom-20 left-0 w-80 md:w-96 rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-white/10" style="background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(16px);">
            <div class="p-4 bg-slate-900/80 text-white flex justify-between items-center border-b border-white/5">
                <div class="flex items-center"><div class="w-2 h-2 bg-emerald-400 rounded-full mr-2 animate-pulse"></div><span class="font-bold text-xs uppercase tracking-widest" style="font-family:'Inter', sans-serif;">University AI Guide</span></div>
                <button id="close-chat" class="text-slate-400 hover:text-white bg-transparent border-none cursor-pointer text-xl">&times;</button>
            </div>
            
            <div class="p-2 flex gap-1 overflow-x-auto bg-slate-800/50">
                <button onclick="askAI('What courses does the university offer?')" class="text-[10px] bg-slate-700 hover:bg-cyan-500/20 px-2 py-1 rounded whitespace-nowrap border-none text-white cursor-pointer">Explore Courses</button>
                <button onclick="askAI('What is the difference between Regular and Self-Financed?')" class="text-[10px] bg-slate-700 hover:bg-indigo-500/20 px-2 py-1 rounded whitespace-nowrap border-none text-white cursor-pointer">Regular vs Self-Financed</button>
                <button onclick="askAI('How to use the PYQ Archive?')" class="text-[10px] bg-slate-700 hover:bg-rose-500/20 px-2 py-1 rounded whitespace-nowrap border-none text-white cursor-pointer">Find PYQs</button>
            </div>

            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto max-h-96 min-h-[350px] bg-slate-900/40 space-y-4" style="font-family:'Inter', sans-serif;">
                <div class="ai-bubble bg-slate-800 text-slate-300 self-start border border-white/5 shadow-sm" style="max-width: 85%; border-radius: 18px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.875rem;">Hello! I am your University AI Guide. Whether you are studying Arts, Science, Commerce, or Professional courses like BCA & BBA, I am here to help you navigate your academic journey!</div>
            </div>

            <div class="p-3 border-t border-white/5 flex gap-2 bg-slate-900/80">
                <input type="text" id="chat-input" placeholder="Ask about any university course..." class="flex-1 bg-slate-800 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-cyan-500 border-none outline-none">
                <button id="send-chat" class="bg-indigo-600 text-white p-2 rounded-lg hover:bg-indigo-500 transition-colors border-none cursor-pointer flex items-center justify-center">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg>
                </button>
            </div>
        </div>
    </div>

    <script id="ai-script-block">
        const systemPrompt = "Act as a world-class Academic Counselor and Tutor for a University. You are an expert in ALL university courses, including Regular courses (B.A., B.Sc., B.Com) and Self-Financed professional courses (BCA, BBA, Biotech). Provide helpful, accurate, and encouraging guidance to students from any discipline. If they ask about engineering, provide technical help. If they ask about arts, provide academic insights. Be concise and use a professional yet encouraging tone.";
        const chatWindow = document.getElementById('ai-chat-window');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');
        const sendBtn = document.getElementById('send-chat');

        if(document.getElementById('ai-toggle-btn')) { document.getElementById('ai-toggle-btn').onclick = () => chatWindow.classList.toggle('hidden'); }
        if(document.getElementById('ai-toggle-top')) { document.getElementById('ai-toggle-top').onclick = () => chatWindow.classList.toggle('hidden'); }
        if(document.getElementById('close-chat')) { document.getElementById('close-chat').onclick = () => chatWindow.classList.add('hidden'); }

        async function askAI(text) { chatInput.value = text; sendMessage(); }

        async function sendMessage() {
            const msg = chatInput.value.trim();
            if (!msg) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'ai-bubble bg-indigo-600/30 text-white self-end ml-auto border border-indigo-500/20';
            userDiv.style.cssText = 'max-width: 85%; border-radius: 18px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.875rem; align-self: flex-end; margin-left: auto;';
            userDiv.innerText = msg;
            chatMessages.appendChild(userDiv);
            chatInput.value = '';
            
            const loadDiv = document.createElement('div');
            loadDiv.className = 'ai-bubble bg-slate-800 text-slate-400 self-start italic';
            loadDiv.style.cssText = 'max-width: 85%; border-radius: 18px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.875rem;';
            loadDiv.innerHTML = 'Analyzing...';
            chatMessages.appendChild(loadDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: msg }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                });
                const data = await res.json();
                const aiMsg = data.candidates?.[0]?.content?.parts?.[0]?.text || "Connection lost to the central server.";
                
                loadDiv.remove();
                const aiDiv = document.createElement('div');
                aiDiv.className = 'ai-bubble bg-slate-800 text-slate-300 self-start border border-white/5';
                aiDiv.style.cssText = 'max-width: 85%; border-radius: 18px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.875rem;';
                aiDiv.innerHTML = '<div class="font-bold text-[10px] text-cyan-400 mb-2 tracking-tighter uppercase">AI Response</div>' + aiMsg.replace(/\n/g, '<br>').replace(/```/g, '<code class="bg-black/50 px-1 rounded">');
                chatMessages.appendChild(aiDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (err) {
                loadDiv.innerHTML = "System Error: Check API Key or Network Connection.";
            }
        }
        if(sendBtn) sendBtn.onclick = sendMessage;
        if(chatInput) chatInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    </script>
    <script src="upload-system.js"></script>
</body>
</html>
