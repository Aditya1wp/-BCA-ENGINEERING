<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester Catalog - Patna University Legacy</title>
    <link rel="icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: { preflight: false }
      }
    </script>
    <style>
        :root {
            --primary: #6366f1;
            --accent: #06b6d4;
            --dark-bg: #0a0f1c;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.07);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- SUPREME BACKGROUND --- */
        .blueprint-grid {
            position: fixed; inset: 0;
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
        }

        /* --- NAVIGATION --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(10, 15, 28, 0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0; z-index: 1100;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo-text {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -1px;
        }

        /* --- HAMBURGER --- */
        .hamburger-btn {
            background: transparent; border: none; cursor: pointer;
            padding: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 1200;
        }
        .hamburger-line { width: 24px; height: 2px; background: white; transition: 0.4s; }
        .hamburger-btn.active .line-1 { transform: translateY(8px) rotate(45deg); background: var(--accent); }
        .hamburger-btn.active .line-2 { opacity: 0; }
        .hamburger-btn.active .line-3 { transform: translateY(-8px) rotate(-45deg); background: var(--accent); }

        .menu-overlay {
            position: fixed; top: 0; right: -420px; bottom: 0; width: 400px;
            background: rgba(10, 15, 28, 0.95); backdrop-filter: blur(40px);
            z-index: 1150; padding: 60px 40px; border-left: 1px solid var(--glass-border);
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .menu-overlay.active { right: 0; }
        .menu-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1140;
            display: none; cursor: pointer; backdrop-filter: blur(4px);
        }
        .menu-backdrop.active { display: block; }

        /* --- MAIN CONTENT --- */
        .supreme-main {
            flex: 1;
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 80px 5%;
        }

        .header-console {
            text-align: center;
            margin-bottom: 80px;
            animation: supremeEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .semesters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 30px;
        }

        /* --- SEMESTER DATA MODULES --- */
        .semester-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
        }

        .semester-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent);
        }

        .card-aura {
            position: absolute;
            top: -50px; right: -50px;
            width: 150px; height: 150px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            opacity: 0.1;
            filter: blur(30px);
            transition: 0.5s;
        }

        .semester-card:hover .card-aura {
            opacity: 0.3;
            transform: scale(1.5);
        }

        .sem-label {
            font-family: 'JetBrains Mono';
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--accent);
            font-weight: 800;
        }

        .sem-title {
            font-family: 'Playfair Display';
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.1;
        }

        .sem-desc {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .card-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-access {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-family: 'JetBrains Mono';
            font-size: 10px;
            transition: 0.3s;
        }

        .semester-card:hover .btn-access {
            background: var(--accent);
            color: black;
            border-color: var(--accent);
        }

        @keyframes supremeEntrance {
            from { opacity: 0; transform: translateY(40px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 600px) {
            .semesters-grid { grid-template-columns: 1fr; }
            .header-console h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="blueprint-grid"></div>

    <div class="menu-backdrop" id="menu-backdrop" onclick="toggleMenu()"></div>

    <nav>
        <div style="display: flex; align-items: center; gap: 20px;">
            <button onclick="window.history.back()" style="background: transparent; border: 1px solid var(--glass-border); color: #94a3b8; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s;">&larr;</button>
            <a href="index.html" style="text-decoration: none; color: white; display: flex; align-items: center; gap: 12px;">
                <img src="logo.png" alt="Logo" style="height: 35px;">
                <div class="logo-text">BCA <span style="color: var(--accent)">ENGINEER</span></div>
            </a>
        </div>

        <button class="hamburger-btn" id="menu-toggle">
            <div class="hamburger-line line-1"></div>
            <div class="hamburger-line line-2"></div>
            <div class="hamburger-line line-3"></div>
        </button>
    </nav>

    <!-- Side Menu -->
    <div class="menu-overlay" id="menu-overlay">
        <div style="font-family: 'JetBrains Mono'; color: var(--accent); font-size: 10px; letter-spacing: 3px; margin-bottom: 30px;">STRUCTURE_VERIFIED</div>
        <div style="display: flex; flex-direction: column; gap: 25px;">
            <a href="index.html" style="color: white; text-decoration: none; font-size: 1.5rem; font-weight: 800; font-family: 'Playfair Display';">Academic Dashboard</a>
            <a href="categories.html" style="color: white; text-decoration: none; font-size: 1.5rem; font-weight: 800; font-family: 'Playfair Display';">Select Program</a>
            <a href="resource-type.html" id="nav-resource-link" style="color: white; text-decoration: none; font-size: 1.5rem; font-weight: 800; font-family: 'Playfair Display';">Resource Type</a>
        </div>
    </div>

    <main class="supreme-main">
        <header class="header-console">
            <div style="font-family: 'JetBrains Mono'; color: var(--accent); font-size: 12px; letter-spacing: 5px; margin-bottom: 15px; text-transform: uppercase;" id="course-label">BCA_ENGINEER_CORE</div>
            <h1 id="page-title" style="font-family: 'Playfair Display'; font-size: 4rem; font-weight: 900; margin-bottom: 20px;">Semester Roadmap</h1>
            <p id="page-desc" style="color: #94a3b8; font-size: 1.2rem; max-width: 600px; margin: 0 auto; font-weight: 300;">Navigate through the modular structure of your academic curriculum.</p>
        </header>

        <div id="semesters-grid" class="semesters-grid">
            <!-- Dynamically Populated -->
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const course = params.get('course') || 'BCA';
        const docType = params.get('docType') || 'pyq';
        const docTypeLabel = docType === 'notes' ? 'NOTES' : 'PYQ';

        document.getElementById('page-title').innerText = `${course.toUpperCase()} ${docTypeLabel}`;
        document.getElementById('course-label').innerText = `${course.toUpperCase()}_SYSTEM_ACTIVE`;
        document.getElementById('nav-resource-link').href = `resource-type.html?course=${encodeURIComponent(course)}`;

        const semestersData = [
            { id: "1st", name: "Semester 01", desc: "Master C Programming & Hardware fundamentals. The crucial foundation for modern computing systems.", icon: "M9.75 17L9 20l-1 1h8l-1-1-.75-3" },
            { id: "2nd", name: "Semester 02", desc: "Unlock Enterprise Java & CPU Architecture. Deep dive into backend logic and system design.", icon: "M10 20l4-16m4 4l4 4-4 4" },
            { id: "3rd", name: "Semester 03", desc: "Dominate Python, OS & System Design. Real-world skills for elite software development.", icon: "M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4" },
            { id: "4th", name: "Semester 04", desc: "Conquer Oracle RDBMS & Networking. Infrastructure that powers the modern internet.", icon: "M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9" },
            { id: "5th", name: "Semester 05", desc: "Crack Data Structures & Big Data. The ultimate technical interview deciders for global tech companies.", icon: "M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656" },
            { id: "6th", name: "Semester 06", desc: "Ship Full-Stack Web & Android Apps. Final transition from academic student to professional creator.", icon: "M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7" }
        ];

        const grid = document.getElementById('semesters-grid');
        
        semestersData.forEach((sem, index) => {
            const delay = index * 100;
            grid.innerHTML += `
                <div onclick="window.location.href='viewer.html?course=${encodeURIComponent(course)}&docType=${docType}&semester=${sem.id}'" 
                     class="semester-card" 
                     style="animation: supremeEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: ${delay}ms;">
                    <div class="card-aura"></div>
                    <div class="sem-label">PHASE_${index + 1}</div>
                    <div style="display: flex; align-items: flex-start; justify-content: space-between;">
                        <h3 class="sem-title">${sem.name}</h3>
                        <svg style="width: 24px; height: 24px; color: var(--accent);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${sem.icon}"></path>
                        </svg>
                    </div>
                    <p class="sem-desc">${sem.desc}</p>
                    <div class="card-footer">
                        <span style="font-family: 'JetBrains Mono'; font-size: 9px; color: rgba(255,255,255,0.3);">STATUS: COMPILED</span>
                        <button class="btn-access">ACCESS_RESOURCES &rarr;</button>
                    </div>
                </div>
            `;
        });

        // Hamburger Toggle
        const menuToggle = document.getElementById('menu-toggle');
        const menuOverlay = document.getElementById('menu-overlay');
        const menuBackdrop = document.getElementById('menu-backdrop');

        function toggleMenu() {
            menuToggle.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            menuBackdrop.classList.toggle('active');
            document.body.style.overflow = menuOverlay.classList.contains('active') ? 'hidden' : 'auto';
        }
        window.toggleMenu = toggleMenu;
        menuToggle.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
