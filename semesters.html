<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Semesters - BCA Engineering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; scroll-behavior: smooth; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="fixed top-0 w-full z-50 glass-card border-b border-white/5 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <!-- Back Button to the previous courses page -->
            <button onclick="window.history.back()" class="p-2 bg-white/5 hover:bg-white/10 rounded-lg transition-colors group">
                <svg class="w-5 h-5 text-slate-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
            <div class="hidden sm:flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">Σ</div>
                <span class="font-extrabold text-xl tracking-tighter">BCA <span class="text-cyan-400">ENGINEERING</span></span>
            </div>
        </div>
        <div class="text-lg font-bold uppercase tracking-wide text-white">
            Program Structure
        </div>
        <div class="w-24"></div> <!-- Spacer for centering -->
    </nav>

    <main class="flex-1 max-w-7xl mx-auto w-full px-6 pt-32 pb-24 relative">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-96 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-cyan-500/10 via-transparent to-transparent -z-10 pointer-events-none"></div>
        
        <header class="text-center mb-16">
            <h1 class="text-5xl md:text-6xl font-black mb-6 leading-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-cyan-300">Bachelor of Computer Applications</h1>
            <p class="text-slate-400 text-lg md:text-xl max-w-3xl mx-auto font-light leading-relaxed">Select a semester to view the comprehensive syllabus, subjects, and previous year questions (PYQ).</p>
        </header>

        <div id="semesters-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Semesters will be injected here by JS -->
        </div>
    </main>

    <script>
        const semestersData = [
            { id: "SEM-01", name: "Semester 01", desc: "Master C Programming & Hardware fundamentals. The crucial foundation 90% of students ignore—don't fall behind on day one.", color: "cyan", icon: "M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" },
            { id: "SEM-02", name: "Semester 02", desc: "Unlock Enterprise Java & CPU Architecture. The exact core skills top tech companies test for. Secure your backend mastery.", color: "indigo", icon: "M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" },
            { id: "SEM-03", name: "Semester 03", desc: "Dominate Python, OS & System Design. Real-world skills that separate elite developers from the rest. Start building today.", color: "rose", icon: "M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" },
            { id: "SEM-04", name: "Semester 04", desc: "Conquer Oracle RDBMS & Networking. Data is the new oil—master the infrastructure that powers the modern internet.", color: "emerald", icon: "M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" },
            { id: "SEM-05", name: "Semester 05", desc: "Crack Data Structures & Big Data. The ultimate FAANG interview deciders. Missing this means failing your technical rounds.", color: "amber", icon: "M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" },
            { id: "SEM-06", name: "Semester 06", desc: "Ship Full-Stack Web & Android Apps. Go from student to creator. Your final leap to becoming a highly-paid software engineer.", color: "fuchsia", icon: "M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" }
        ];

        const grid = document.getElementById('semesters-grid');
        
        semestersData.forEach((sem, index) => {
            const delay = index * 100;
            const c = sem.color;
            
            grid.innerHTML += `
                <div class="glass-card rounded-2xl p-6 relative overflow-hidden group hover:-translate-y-2 transition-all duration-300 animate-[fadeIn_0.5s_ease-out_forwards] cursor-pointer" style="animation-delay: ${delay}ms; opacity: 0;">
                    <div class="absolute -right-10 -top-10 w-32 h-32 bg-${c}-500/10 rounded-full blur-3xl group-hover:bg-${c}-500/20 transition-all"></div>
                    
                    <div class="flex items-start justify-between mb-4 relative z-10">
                        <div class="p-3 bg-${c}-500/10 rounded-xl text-${c}-400 group-hover:scale-110 transition-transform">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${sem.icon}"></path></svg>
                        </div>
                        <div class="bg-white/5 text-white/50 px-2 py-1 rounded text-xs group-hover:bg-white/10 group-hover:text-white transition-colors border border-white/5">Enter Phase</div>
                    </div>
                    
                    <div class="relative z-10">
                        <h3 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-${c}-300 to-${c}-500 mb-2 group-hover:scale-105 transform origin-left transition-transform">${sem.name}</h3>
                        <p class="text-sm text-slate-400 mb-4 min-h-[4rem]">${sem.desc}</p>
                        
                        <div class="pt-4 border-t border-white/5 flex items-center justify-between">
                            <span class="text-[10px] font-bold tracking-widest uppercase text-slate-500">Status</span>
                            <span class="text-xs font-semibold text-${c}-400 bg-${c}-500/10 px-2 py-1 rounded shadow-[0_0_10px_rgba(255,255,255,0.05)]">Modules Active</span>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
