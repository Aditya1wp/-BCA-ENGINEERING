<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA ENGINEER | GitHub CMS</title>
    <link rel="icon" type="image/png" href="logo.png">

    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              gray: {
                900: '#0B1120',
                800: '#0f172a',
                700: '#1e293b',
              }
            }
          }
        }
      }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { background-color: #0B1120; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // SVG Icons
        const Icons = {
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Upload: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>,
            FileText: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
            Check: () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
            Alert: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
            Database: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>,
            ArrowLeft: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>,
            Folder: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>,
        };

        const MAX_FILE_SIZE_MB = 10;
        const SEMESTERS = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th'];

        const COURSE_DATA = {
            'Regular UG': ['B.A. Hons', 'B.Sc. Hons', 'B.Com. Hons'],
            'Self-Financed UG': ['BCA', 'BBA', 'B.Lib.I.Sc.', 'BFA', 'B.MC', 'BSW', 'Functional English', 'Biotechnology', 'Environmental Science'],
            'Regular PG': ['M.A.', 'M.Sc.', 'M.Com.', 'LL.M.', 'M.Ed.'],
            'Self-Financed PG': ['MCA', 'MBA', 'PMIR', 'M.Sc. Biotechnology', 'M.Sc. Environmental Science', 'M.Sc. Bio-Chemistry', 'MJMC', 'MSW', 'M.Lib.I.Sc.', 'M.A. Women\'s Studies', 'M.A. Music'],
            'PG Diploma': ['PGDCA', 'Public Administration', 'Industrial Safety Management', 'Yogic Science', 'Human Resource Development', 'Clinical Psychology', 'Women\'s Studies']
        };

        // Helper: Convert File to Base64
        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]); // Only keep the raw base64 content
            reader.onerror = error => reject(error);
        });

        // Helper: Encode text to Base64 safely (handling UTF-8)
        const textToBase64 = (text) => btoa(unescape(encodeURIComponent(text)));
        const base64ToText = (base64) => decodeURIComponent(escape(atob(base64)));

        function App() {
            // State
            const [config, setConfig] = useState({ token: '', owner: '', repo: '' });
            const [isConfigured, setIsConfigured] = useState(false);
            const [view, setView] = useState('dashboard'); // 'dashboard', 'upload', 'settings'
            const [documents, setDocuments] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [searchQuery, setSearchQuery] = useState('');

            // Upload Form State
            const fileInputRef = useRef(null);
            const [uploading, setUploading] = useState(false);
            const [viewMode, setViewMode] = useState('single'); // 'single', 'bulk'
            const [bulkFiles, setBulkFiles] = useState([]); // [{file, metadata, status, error, selected}]
            const [batchEdit, setBatchEdit] = useState({ category: '', courseName: '', semester: '', year: '' });
            const [uploadForm, setUploadForm] = useState({
                category: '',
                courseName: '',
                subjectCode: '',
                subjectName: '',
                year: new Date().getFullYear(),
                semester: '1st',
                file: null
            });
            const [renameFolder, setRenameFolder] = useState({ oldName: '', newName: '', showModal: false });
            const [editDoc, setEditDoc] = useState({ doc: null, show: false });

            // Initialize
            useEffect(() => {
                const savedConfig = localStorage.getItem('github_cms_config');
                if (savedConfig) {
                    const parsed = JSON.parse(savedConfig);
                    if (parsed.token && parsed.owner && parsed.repo) {
                        setConfig(parsed);
                        setIsConfigured(true);
                    } else {
                        setView('settings');
                        setLoading(false);
                    }
                } else {
                    setView('settings');
                    setLoading(false);
                }
            }, []);

            // Fetch Database
            useEffect(() => {
                if (isConfigured && view === 'dashboard') {
                    fetchDatabase();
                }
            }, [isConfigured, view]);

            const githubFetch = async (path, options = {}) => {
                const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`, {
                    ...options,
                    headers: {
                        'Authorization': `Bearer ${config.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });
                return res;
            };

            const fetchDatabase = async () => {
                setLoading(true);
                setError('');
                try {
                    const res = await githubFetch('database.json');
                    if (res.status === 404) {
                        // File doesn't exist, we will create it on first upload
                        setDocuments([]);
                    } else if (!res.ok) {
                        throw new Error(`GitHub API Error: ${res.statusText}`);
                    } else {
                        const data = await res.json();
                        const content = base64ToText(data.content);
                        setDocuments(JSON.parse(content));
                    }
                } catch (err) {
                    console.error(err);
                    setError(err.message || 'Failed to fetch database.json. Check your credentials and repo name.');
                    if(err.message.includes("401") || err.message.includes("404")) {
                        setView('settings'); // Force them to check settings
                    }
                } finally {
                    setLoading(false);
                }
            };

            const saveConfig = (e) => {
                e.preventDefault();
                localStorage.setItem('github_cms_config', JSON.stringify(config));
                setIsConfigured(true);
                setView('dashboard');
                fetchDatabase();
            };

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                setError('');
                if (file) {
                    if (file.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
                        setError(`File size exceeds ${MAX_FILE_SIZE_MB}MB limit.`);
                        setUploadForm(prev => ({ ...prev, file: null }));
                        e.target.value = null;
                    } else {
                        setUploadForm(prev => ({ ...prev, file }));
                    }
                }
            };

            const handleUpload = async (e) => {
                e.preventDefault();
                if (!uploadForm.subjectCode || !uploadForm.subjectName || !uploadForm.file || !uploadForm.category || !uploadForm.courseName) {
                    setError('Please fill all fields and select a file.');
                    return;
                }

                setUploading(true);
                setError('');
                try {
                    const safeSubjectCode = uploadForm.subjectCode.replace(/[^a-zA-Z0-9-]/g, '_').toUpperCase();
                    const safeCourseName = uploadForm.courseName.replace(/[^a-zA-Z0-9-]/g, '_').toLowerCase();
                    const timestamp = Date.now();
                    const ext = '.pdf';
                    const filePath = `uploads/${safeCourseName}/${uploadForm.semester}/${safeSubjectCode}_${timestamp}${ext}`;

                    // 1. Convert to Base64
                    const base64Content = await fileToBase64(uploadForm.file);

                    // 2. Upload PDF
                    const pdfRes = await githubFetch(filePath, {
                        method: 'PUT',
                        body: JSON.stringify({
                            message: `feat: add resource ${safeSubjectCode} to ${safeCourseName}`,
                            content: base64Content
                        })
                    });

                    if (!pdfRes.ok) {
                        const errData = await pdfRes.json();
                        throw new Error(errData.message || 'Failed to upload PDF to GitHub');
                    }
                    const pdfData = await pdfRes.json();
                    const downloadUrl = pdfData.content.download_url;

                    // 3. Update database.json
                    let currentDb = [];
                    let dbSha = null;
                    const dbFetchRes = await githubFetch('database.json');
                    
                    if (dbFetchRes.ok) {
                        const dbFetchData = await dbFetchRes.json();
                        currentDb = JSON.parse(base64ToText(dbFetchData.content));
                        dbSha = dbFetchData.sha;
                    }

                    const newRecord = {
                        id: timestamp.toString(),
                        category: uploadForm.category,
                        courseName: uploadForm.courseName,
                        subjectCode: safeSubjectCode,
                        subjectName: uploadForm.subjectName,
                        year: parseInt(uploadForm.year),
                        semester: uploadForm.semester,
                        createdAt: new Date().toISOString(),
                        fileName: uploadForm.file.name,
                        fileSize: uploadForm.file.size,
                        downloadUrl: downloadUrl
                    };

                    currentDb.push(newRecord);

                    const dbBody = {
                        message: `update: append ${safeSubjectCode} to database.json`,
                        content: textToBase64(JSON.stringify(currentDb, null, 2))
                    };
                    if (dbSha) dbBody.sha = dbSha;

                    const dbUpdateRes = await githubFetch('database.json', {
                        method: 'PUT',
                        body: JSON.stringify(dbBody)
                    });

                    if (!dbUpdateRes.ok) throw new Error('Failed to update database.json');

                    setUploadForm({ category: '', courseName: '', subjectCode: '', subjectName: '', year: new Date().getFullYear(), semester: '1st', file: null });
                    setView('dashboard');
                    fetchDatabase();
                } catch (err) {
                    setError(err.message || 'Upload failed.');
                } finally {
                    setUploading(false);
                }
            };

            const handleBulkFileSelect = (e) => {
                const files = Array.from(e.target.files);
                const newBulkFiles = files.map(file => {
                    const nameWithoutExt = file.name.replace(/\.pdf$/i, '');
                    // Improved parsing: try to find CS-101 or similar patterns
                    const codeMatch = nameWithoutExt.match(/[a-zA-Z]{1,4}-[0-9]{2,4}/);
                    const code = codeMatch ? codeMatch[0] : '';
                    
                    return { 
                        file, 
                        metadata: {
                            category: 'Self-Financed UG',
                            courseName: 'BCA',
                            semester: '1st',
                            subjectCode: code || nameWithoutExt.substring(0, 8),
                            subjectName: nameWithoutExt,
                            year: nameWithoutExt.match(/\d{4}/)?.[0] ? parseInt(nameWithoutExt.match(/\d{4}/)[0]) : new Date().getFullYear()
                        }, 
                        status: 'pending', 
                        error: null,
                        selected: false 
                    };
                });
                setBulkFiles([...bulkFiles, ...newBulkFiles]);
            };

            const toggleFileSelection = (idx) => {
                const updated = [...bulkFiles];
                updated[idx].selected = !updated[idx].selected;
                setBulkFiles(updated);
            };

            const toggleAllSelection = () => {
                const allSelected = bulkFiles.every(f => f.selected);
                setBulkFiles(bulkFiles.map(f => ({ ...f, selected: !allSelected })));
            };

            const applyBatchEdit = () => {
                const updated = bulkFiles.map(f => {
                    if (!f.selected) return f;
                    return {
                        ...f,
                        metadata: {
                            ...f.metadata,
                            category: batchEdit.category || f.metadata.category,
                            courseName: batchEdit.courseName || f.metadata.courseName,
                            semester: batchEdit.semester || f.metadata.semester,
                            year: batchEdit.year ? parseInt(batchEdit.year) : f.metadata.year
                        }
                    };
                });
                setBulkFiles(updated);
            };

            const updateRowMetadata = (idx, field, value) => {
                const updated = [...bulkFiles];
                updated[idx].metadata[field] = value;
                setBulkFiles(updated);
            };

            const processBulkUpload = async () => {
                setUploading(true);
                setError('');
                
                let currentDb = [];
                let dbSha = null;
                try {
                    const dbFetchRes = await githubFetch('database.json');
                    if (dbFetchRes.ok) {
                        const dbFetchData = await dbFetchRes.json();
                        currentDb = JSON.parse(base64ToText(dbFetchData.content));
                        dbSha = dbFetchData.sha;
                    }
                } catch (e) { console.error("Initial DB fetch failed", e); }

                const updatedBulkFiles = [...bulkFiles];

                for (let i = 0; i < updatedBulkFiles.length; i++) {
                    if (updatedBulkFiles[i].status === 'success') continue;
                    
                    const item = updatedBulkFiles[i];
                    updatedBulkFiles[i].status = 'uploading';
                    setBulkFiles([...updatedBulkFiles]);

                    try {
                        const meta = item.metadata;
                        const safeSubjectCode = meta.subjectCode.replace(/[^a-zA-Z0-9-]/g, '_').toUpperCase();
                        const safeCourseName = meta.courseName.replace(/[^a-zA-Z0-9-]/g, '_').toLowerCase();
                        const timestamp = Date.now() + i;
                        const filePath = `uploads/${safeCourseName}/${meta.semester}/${safeSubjectCode}_${timestamp}.pdf`;

                        const base64Content = await fileToBase64(item.file);
                        const pdfRes = await githubFetch(filePath, {
                            method: 'PUT',
                            body: JSON.stringify({
                                message: `bulk: add ${safeSubjectCode}`,
                                content: base64Content
                            })
                        });

                        if (!pdfRes.ok) throw new Error("GitHub API Error");
                        const pdfData = await pdfRes.json();

                        const newRecord = {
                            id: timestamp.toString(),
                            category: meta.category,
                            courseName: meta.courseName,
                            subjectCode: safeSubjectCode,
                            subjectName: meta.subjectName || 'Unknown',
                            year: meta.year,
                            semester: meta.semester,
                            createdAt: new Date().toISOString(),
                            fileName: item.file.name,
                            fileSize: item.file.size,
                            downloadUrl: pdfData.content.download_url
                        };
                        currentDb.push(newRecord);

                        updatedBulkFiles[i].status = 'success';
                    } catch (err) {
                        updatedBulkFiles[i].status = 'error';
                        updatedBulkFiles[i].error = err.message;
                    }
                    setBulkFiles([...updatedBulkFiles]);
                }

                try {
                    const dbRefetch = await githubFetch('database.json');
                    if (dbRefetch.ok) {
                        const refetchData = await dbRefetch.json();
                        dbSha = refetchData.sha;
                    }

                    const dbBody = {
                        message: `update: bulk publish ${updatedBulkFiles.filter(f => f.status === 'success').length} resources`,
                        content: textToBase64(JSON.stringify(currentDb, null, 2))
                    };
                    if (dbSha) dbBody.sha = dbSha;

                    const dbUpdateRes = await githubFetch('database.json', {
                        method: 'PUT',
                        body: JSON.stringify(dbBody)
                    });

                    if (!dbUpdateRes.ok) throw new Error('Database sync failed');
                    fetchDatabase();
                } catch (err) {
                    setError('Uploads complete, but database sync failed: ' + err.message);
                } finally {
                    setUploading(false);
                }
            };

            const filteredDocs = useMemo(() => {
                return documents.filter(doc => 
                    doc.subjectCode.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    doc.subjectName.toLowerCase().includes(searchQuery.toLowerCase())
                ).sort((a, b) => b.id - a.id); // Sort newest first
            }, [documents, searchQuery]);

            const handleDelete = async (doc) => {
                if (!confirm(`Are you sure you want to delete "${doc.subjectCode}"? This will remove the file from GitHub and the database.`)) return;

                setLoading(true);
                setError('');
                try {
                    // 1. Get path from downloadUrl
                    // Example: https://raw.githubusercontent.com/owner/repo/main/uploads/bca/1st/file.pdf
                    // We need 'uploads/bca/1st/file.pdf'
                    const urlParts = doc.downloadUrl.split('/');
                    const mainIndex = urlParts.indexOf('main');
                    if (mainIndex === -1) throw new Error("Could not determine file path from URL. Is it in the 'main' branch?");
                    const filePath = urlParts.slice(mainIndex + 1).join('/');

                    // 2. Fetch file to get SHA
                    const fileRes = await githubFetch(filePath);
                    if (fileRes.ok) {
                        const fileData = await fileRes.json();
                        const sha = fileData.sha;

                        // 3. Delete file from GitHub
                        const delRes = await githubFetch(filePath, {
                            method: 'DELETE',
                            body: JSON.stringify({
                                message: `refactor: delete resource ${doc.subjectCode}`,
                                sha: sha
                            })
                        });
                        if (!delRes.ok) console.warn("Failed to delete physical file, it might already be gone.");
                    }

                    // 4. Update database.json
                    const dbFetchRes = await githubFetch('database.json');
                    if (!dbFetchRes.ok) throw new Error("Failed to fetch database.json for update");
                    
                    const dbData = await dbFetchRes.json();
                    let currentDb = JSON.parse(base64ToText(dbData.content));
                    
                    const updatedDb = currentDb.filter(d => d.id !== doc.id);

                    const dbUpdateRes = await githubFetch('database.json', {
                        method: 'PUT',
                        body: JSON.stringify({
                            message: `update: remove ${doc.subjectCode} from database.json`,
                            content: textToBase64(JSON.stringify(updatedDb, null, 2)),
                            sha: dbData.sha
                        })
                    });

                    if (!dbUpdateRes.ok) throw new Error("Failed to sync database.json after deletion");

                    setDocuments(updatedDb);
                } catch (err) {
                    setError(err.message || 'Deletion failed.');
                } finally {
                    setLoading(false);
                }
            };

            const handleRenameCourse = async () => {
                if (!renameFolder.oldName || !renameFolder.newName) return;
                if (!confirm(`Rename all documents in "${renameFolder.oldName}" to "${renameFolder.newName}"? This only updates the database categorization.`)) return;

                setLoading(true);
                setError('');
                try {
                    const dbFetchRes = await githubFetch('database.json');
                    if (!dbFetchRes.ok) throw new Error("Failed to fetch database.json");
                    
                    const dbData = await dbFetchRes.json();
                    let currentDb = JSON.parse(base64ToText(dbData.content));
                    
                    let count = 0;
                    const updatedDb = currentDb.map(doc => {
                        if (doc.courseName === renameFolder.oldName) {
                            count++;
                            return { ...doc, courseName: renameFolder.newName };
                        }
                        return doc;
                    });

                    if (count === 0) {
                        throw new Error(`No documents found for course "${renameFolder.oldName}"`);
                    }

                    const dbUpdateRes = await githubFetch('database.json', {
                        method: 'PUT',
                        body: JSON.stringify({
                            message: `refactor: rename course ${renameFolder.oldName} to ${renameFolder.newName}`,
                            content: textToBase64(JSON.stringify(updatedDb, null, 2)),
                            sha: dbData.sha
                        })
                    });

                    if (!dbUpdateRes.ok) throw new Error("Failed to sync database.json after rename");

                    setDocuments(updatedDb);
                    setRenameFolder({ oldName: '', newName: '', showModal: false });
                    alert(`Successfully renamed ${count} documents.`);
                } catch (err) {
                    setError(err.message || 'Rename failed.');
                } finally {
                    setLoading(false);
                }
            };

            const handleUpdateDoc = async (e) => {
                e.preventDefault();
                const doc = editDoc.doc;
                if (!doc) return;

                setLoading(true);
                setError('');
                try {
                    const dbFetchRes = await githubFetch('database.json');
                    if (!dbFetchRes.ok) throw new Error("Failed to fetch database.json");
                    
                    const dbData = await dbFetchRes.json();
                    let currentDb = JSON.parse(base64ToText(dbData.content));
                    
                    const updatedDb = currentDb.map(d => {
                        if (d.id === doc.id) {
                            return { 
                                ...d, 
                                subjectName: doc.subjectName,
                                subjectCode: doc.subjectCode.replace(/[^a-zA-Z0-9-]/g, '_').toUpperCase(),
                                year: parseInt(doc.year),
                                semester: doc.semester
                            };
                        }
                        return d;
                    });

                                                </div>
                                            ) : (
                                                <div className="space-y-6">
                                                    {/* Batch Action Bar */}
                                                    <div className="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 flex flex-wrap items-center gap-4 sticky top-0 z-20 shadow-xl">
                                                        <div className="flex items-center gap-2">
                                                            <input type="checkbox" className="w-4 h-4 rounded border-slate-600 bg-slate-900 text-cyan-500" checked={bulkFiles.every(f => f.selected)} onChange={toggleAllSelection} />
                                                            <span className="text-xs font-bold text-slate-300 uppercase tracking-widest">{bulkFiles.filter(f => f.selected).length} Selected</span>
                                                        </div>
                                                        <div className="h-6 w-px bg-slate-700 mx-2"></div>
                                                        <select className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-[10px] text-white outline-none" value={batchEdit.courseName} onChange={e => setBatchEdit({...batchEdit, courseName: e.target.value})}>
                                                            <option value="">Set Course</option>
                                                            {Object.values(COURSE_DATA).flat().map(c => <option key={c} value={c}>{c}</option>)}
                                                        </select>
                                                        <select className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-[10px] text-white outline-none" value={batchEdit.semester} onChange={e => setBatchEdit({...batchEdit, semester: e.target.value})}>
                                                            <option value="">Set Sem</option>
                                                            {SEMESTERS.map(s => <option key={s} value={s}>{s}</option>)}
                                                        </select>
                                                        <input type="number" placeholder="Year" className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-[10px] text-white w-16 outline-none" value={batchEdit.year} onChange={e => setBatchEdit({...batchEdit, year: e.target.value})} />
                                                        <button onClick={applyBatchEdit} className="bg-cyan-500 text-[#0B1120] px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest hover:bg-cyan-400 transition-all">Apply to Selected</button>
                                                        <button onClick={() => setBulkFiles([])} className="text-red-400 text-[10px] font-bold uppercase ml-auto">Clear All</button>
                                                    </div>
                                                    
                                                    {/* Grid View */}
                                                    <div className="overflow-x-auto glass-panel rounded-2xl border border-slate-800">
                                                        <table className="w-full text-left border-collapse">
                                                            <thead>
                                                                <tr className="bg-slate-900/50 text-[10px] font-black text-slate-500 uppercase tracking-widest border-b border-slate-800">
                                                                    <th className="p-4 w-10"></th>
                                                                    <th className="p-4">File Name</th>
                                                                    <th className="p-4 w-32">Course</th>
                                                                    <th className="p-4 w-24">Sem</th>
                                                                    <th className="p-4 w-32">Subj Code</th>
                                                                    <th className="p-4 w-20">Year</th>
                                                                    <th className="p-4">Status</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-slate-800/50">
                                                                {bulkFiles.map((item, idx) => (
                                                                    <tr key={idx} className={`group hover:bg-white/[0.02] transition-colors ${item.selected ? 'bg-cyan-500/5' : ''}`}>
                                                                        <td className="p-4">
                                                                            <input type="checkbox" className="w-4 h-4 rounded border-slate-700 bg-slate-900 text-cyan-500" checked={item.selected} onChange={() => toggleFileSelection(idx)} />
                                                                        </td>
                                                                        <td className="p-4 min-w-[200px]">
                                                                            <p className="text-xs font-bold text-white truncate max-w-[180px]" title={item.file.name}>{item.file.name}</p>
                                                                            <p className="text-[10px] text-slate-500">{(item.file.size / 1024).toFixed(0)} KB</p>
                                                                        </td>
                                                                        <td className="p-4">
                                                                            <select className="bg-transparent border-none text-xs text-cyan-400 font-medium p-0 outline-none cursor-pointer focus:text-white" value={item.metadata.courseName} onChange={e => updateRowMetadata(idx, 'courseName', e.target.value)}>
                                                                                {Object.values(COURSE_DATA).flat().map(c => <option key={c} value={c}>{c}</option>)}
                                                                            </select>
                                                                        </td>
                                                                        <td className="p-4">
                                                                            <select className="bg-transparent border-none text-xs text-slate-400 p-0 outline-none cursor-pointer focus:text-white" value={item.metadata.semester} onChange={e => updateRowMetadata(idx, 'semester', e.target.value)}>
                                                                                {SEMESTERS.map(s => <option key={s} value={s}>{s}</option>)}
                                                                            </select>
                                                                        </td>
                                                                        <td className="p-4">
                                                                            <input type="text" className="bg-slate-900/50 border border-slate-800 rounded px-2 py-1 text-[10px] text-white w-full outline-none focus:border-cyan-500/50" value={item.metadata.subjectCode} onChange={e => updateRowMetadata(idx, 'subjectCode', e.target.value)} />
                                                                        </td>
                                                                        <td className="p-4">
                                                                            <input type="number" className="bg-slate-900/50 border border-slate-800 rounded px-2 py-1 text-[10px] text-white w-16 outline-none focus:border-cyan-500/50" value={item.metadata.year} onChange={e => updateRowMetadata(idx, 'year', e.target.value)} />
                                                                        </td>
                                                                        <td className="p-4 text-center">
                                                                            {item.status === 'success' ? (
                                                                                <span className="text-emerald-400"><Icons.Check /></span>
                                                                            ) : item.status === 'error' ? (
                                                                                <span className="text-red-500" title={item.error}><Icons.Alert /></span>
                                                                            ) : item.status === 'uploading' ? (
                                                                                <div className="w-4 h-4 border-2 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                                                                            ) : (
                                                                                <span className="text-slate-600">--</span>
                                                                            )}
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>

                                                    <button 
                                                        onClick={processBulkUpload}
                                                        disabled={uploading || bulkFiles.length === 0 || bulkFiles.every(f => f.status === 'success')}
                                                        className={`w-full py-4 rounded-2xl font-black uppercase tracking-widest transition-all ${uploading ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white hover:scale-[1.01] active:scale-95 shadow-2xl shadow-cyan-500/20'}`}
                                                    >
                                                        {uploading ? 'Batch Processing...' : `Publish ${bulkFiles.filter(f => f.status !== 'success').length} Resources to GitHub`}
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                                
                                {viewMode === 'bulk' && bulkFiles.length > 0 && (
                                    <div className="glass-panel p-6 rounded-3xl border border-indigo-500/10 grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="p-2">
                                            <p className="text-[10px] text-slate-500 uppercase font-bold mb-1">Total</p>
                                            <p className="text-xl font-black text-white">{bulkFiles.length}</p>
                                        </div>
                                        <div className="p-2">
                                            <p className="text-[10px] text-emerald-500/70 uppercase font-bold mb-1">Success</p>
                                            <p className="text-xl font-black text-emerald-400">{bulkFiles.filter(f => f.status === 'success').length}</p>
                                        </div>
                                        <div className="p-2">
                                            <p className="text-[10px] text-red-500/70 uppercase font-bold mb-1">Errors</p>
                                            <p className="text-xl font-black text-red-400">{bulkFiles.filter(f => f.status === 'error').length}</p>
                                        </div>
                                        <div className="p-2">
                                            <p className="text-[10px] text-cyan-500/70 uppercase font-bold mb-1">Progress</p>
                                            <p className="text-xl font-black text-cyan-400">{Math.round((bulkFiles.filter(f => f.status === 'success').length / bulkFiles.length) * 100)}%</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
